<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synthetic Background Tab Fixture</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      max-width: 580px;
      margin: 0 auto;
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px 0;
      color: #38bdf8;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin: 0 0 8px 0;
    }
    .status-box {
      margin-top: 20px;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Isolated Fixture</span>
    <h1>Background Tab Creation Test</h1>
    <p>This synthetic page is loaded by the disposable MV3 extension fixture via <code>chrome.tabs.create({ active: false })</code>.</p>
    <div class="status-box">
      State: Background Tab Loaded (active: false)
    </div>
  </div>
</body>
</html>
