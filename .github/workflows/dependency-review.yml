name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: github.event.repository.fork == false
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
      - name: Explain fork limitation
        if: github.event.repository.fork == true
        run: echo "GitHub blocks the Dependency Review API on forks; npm audit and registry-signature checks remain enforced by CI."
