name: One-shot format Windows cloudflared wiring

on:
  push:
    branches:
      - chatgpt/windows-cloudflared-autoinstall

permissions:
  contents: write

jobs:
  format-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fix focused source indentation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/cli.ts")
          text = path.read_text(encoding="utf-8")
          start_marker = 'const release = process.platform === "linux"\n'
          end_marker = '  if (await isVerifiedManagedFile(destination, source.sha256) && canRun(destination)) return destination;\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("expected unique cloudflared formatting markers")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          fixed = "".join(("  " + line) if line.strip() else line for line in block.splitlines(keepends=True))
          text = text[:start] + fixed + text[end:]
          path.write_text(text, encoding="utf-8")
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts --audit=false
      - run: npm run build
      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-format-windows-cloudflared.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.ts .github/workflows/one-shot-format-windows-cloudflared.yml
          git commit -m "style: align cloudflared installer block"
          git push origin HEAD:chatgpt/windows-cloudflared-autoinstall
