name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 05 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts --audit=false
      - run: npm audit signatures
      - name: Report dependency advisories
        # The current lockfile already contains known advisories on master.
        # Keep them visible without making this integration PR establish a
        # permanently failing baseline; dependency review still blocks newly
        # introduced moderate-or-higher vulnerabilities.
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm pack --dry-run
