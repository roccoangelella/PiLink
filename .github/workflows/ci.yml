name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 05 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Verify exact toolchain
        run: node -e "if (process.version !== 'v24.18.0') throw new Error('Expected Node.js 24.18.0, got ' + process.version); const {execFileSync}=require('node:child_process'); const npm=execFileSync('npm',['--version'],{encoding:'utf8'}).trim(); if(npm !== '11.16.0') throw new Error('Expected npm 11.16.0, got '+npm)"
      - run: npm ci --ignore-scripts --audit=false
      - run: npm audit signatures
      - run: npm audit --audit-level=moderate
      - run: npm run security:scan:history
      - run: npm run plugin:verify
      - run: npm run test:all
      - run: npm run release:stage
      - run: npm run release:verify
