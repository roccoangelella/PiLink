name: One-shot Windows cloudflared wiring

on:
  push:
    branches:
      - chatgpt/windows-cloudflared-autoinstall

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply focused CLI patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/cli.ts")
          text = path.read_text(encoding="utf-8")

          old_import = 'import { runHostingCli } from "./hosting/cli.js";\nimport { runAgentAuthCli } from "./agents/auth-cli.js";'
          new_import = 'import { runHostingCli } from "./hosting/cli.js";\nimport { resolveCloudflaredRelease } from "./hosting/cloudflared-release.js";\nimport { runAgentAuthCli } from "./agents/auth-cli.js";'
          if text.count(old_import) != 1:
              raise SystemExit("expected exactly one hosting import anchor")
          text = text.replace(old_import, new_import, 1)

          old_block = '''  const destination = path.join(path.dirname(configPath), "bin", cloudflaredFileName());
          if (process.platform !== "linux") {
            throw new Error("cloudflared is not installed. Install it from https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/ and run pilink start again.");
          }

          const asset = cloudflaredAsset();
          const architecture = supportedLinuxArchitecture("cloudflared");
          const source = customOrPinnedDownload(
            "cloudflared",
            process.env.PI_CLOUDFLARED_URL,
            process.env.PI_CLOUDFLARED_SHA256,
            `https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${asset}`,
            CLOUDFLARED_LINUX_SHA256[architecture],
          );'''
          new_block = '''  const destination = path.join(path.dirname(configPath), "bin", cloudflaredFileName());
          const release = process.platform === "linux"
            ? {
                asset: cloudflaredAsset(),
                sha256: CLOUDFLARED_LINUX_SHA256[supportedLinuxArchitecture("cloudflared")],
              }
            : resolveCloudflaredRelease();
          const { asset } = release;
          const source = customOrPinnedDownload(
            "cloudflared",
            process.env.PI_CLOUDFLARED_URL,
            process.env.PI_CLOUDFLARED_SHA256,
            `https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${asset}`,
            release.sha256,
          );'''
          if text.count(old_block) != 1:
              raise SystemExit("expected exactly one cloudflared installer block")
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding="utf-8")
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts --audit=false
      - run: npm run test:all
      - name: Commit tested patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-wire-windows-cloudflared.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.ts .github/workflows/one-shot-wire-windows-cloudflared.yml
          git commit -m "fix: auto-install cloudflared on Windows x64"
          git push origin HEAD:chatgpt/windows-cloudflared-autoinstall
