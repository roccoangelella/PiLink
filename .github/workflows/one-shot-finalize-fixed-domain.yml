name: One-shot finalize fixed-domain guidance

on:
  push:
    branches:
      - chatgpt/fixed-domain-hosting

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: python .github/scripts/finalize-fixed-domain-guidance.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts --audit=false
      - run: npm run test:all
      - name: Commit tested guidance and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/one-shot-finalize-fixed-domain.yml
          rm .github/scripts/finalize-fixed-domain-guidance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: guide fixed-domain route setup in VS Code"
          git push origin HEAD:chatgpt/fixed-domain-hosting
