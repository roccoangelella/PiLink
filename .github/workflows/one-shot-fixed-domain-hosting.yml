name: One-shot fixed-domain hosting wiring

on:
  push:
    branches:
      - chatgpt/fixed-domain-hosting

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Wire fixed-domain hosting
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          cli_path = Path("src/cli.ts")
          cli = cli_path.read_text(encoding="utf-8")
          cli = replace_once(
              cli,
              'import { resolveCloudflaredRelease } from "./hosting/cloudflared-release.js";\n',
              'import { resolveCloudflaredRelease } from "./hosting/cloudflared-release.js";\nimport { fixedDomainCloudflaredArgs, normalizeFixedDomainHostname, normalizeFixedDomainTunnelId, resolveFixedDomainTokenFile } from "./hosting/fixed-domain.js";\n',
              "fixed-domain import",
          )
          cli = replace_once(
              cli,
              'type LaunchMode = "single" | "collaboration" | "vscode";\n',
              'type LaunchMode = "single" | "collaboration" | "vscode";\ntype HostingMode = "quick-tunnel" | "nip-io" | "cloudflare-named";\n',
              "hosting mode type",
          )
          cli = replace_once(
              cli,
              '  let hostingMode: "quick-tunnel" | "nip-io";\n',
              '  let hostingMode: HostingMode;\n',
              "start hosting type",
          )
          cli = replace_once(
              cli,
              '  if (hostingMode === "nip-io") {\n    await startNipIo(options.unsafe, options.setup);\n    return;\n  }\n  await startQuickTunnel(options.unsafe, options.setup);\n',
              '  if (hostingMode === "nip-io") {\n    await startNipIo(options.unsafe, options.setup);\n    return;\n  }\n  if (hostingMode === "cloudflare-named") {\n    await startCloudflareNamed(options.unsafe, options.setup);\n    return;\n  }\n  await startQuickTunnel(options.unsafe, options.setup);\n',
              "start hosting dispatch",
          )

          start_marker = 'async function startQuickTunnel(unsafe: boolean, forceSetup: boolean): Promise<void> {\n'
          if cli.count(start_marker) != 1:
              raise SystemExit("startQuickTunnel marker must be unique")
          named_start = '''async function startCloudflareNamed(unsafe: boolean, forceSetup: boolean): Promise<void> {
            loadEnvironment();
            const serverUrl = configuredFixedDomainServerUrl();
            const tunnelId = normalizeFixedDomainTunnelId(process.env.PI_CLOUDFLARE_TUNNEL_ID || "");
            const tokenFile = resolveFixedDomainTokenFile(process.env.PI_CLOUDFLARE_TOKEN_FILE || "");
            let executable: string;
            try {
              executable = await ensureCloudflared();
            } catch (error) {
              console.error(error instanceof Error ? error.message : "Unable to install cloudflared");
              process.exitCode = 1;
              return;
            }

            const tunnel = spawn(executable, fixedDomainCloudflaredArgs({ tunnelId, tokenFile }), {
              stdio: ["ignore", "ignore", "pipe"],
              windowsHide: true,
            });
            let server: ChildProcess | undefined;
            let shuttingDown = false;
            tunnel.stderr?.on("data", (chunk: Buffer) => writeServerOutput(chunk.toString()));
            tunnel.on("error", (error: NodeJS.ErrnoException) => {
              if (error.code === "ENOENT") console.error("cloudflared could not be executed after installation.");
              else console.error(`Unable to start the Cloudflare Named Tunnel: ${error.message}`);
              server?.kill("SIGINT");
              process.exitCode = 1;
            });
            tunnel.on("exit", (code) => {
              if (shuttingDown) return;
              shuttingDown = true;
              console.error(`Cloudflare Named Tunnel exited (${code ?? "signal"}); stopping PiLink.`);
              server?.kill("SIGINT");
              process.exitCode = code === 0 ? 0 : 1;
            });

            printCloudflareNamedStartupInstructions(serverUrl);
            const startedServer = startServer(unsafe, serverUrl, tunnel);
            server = startedServer.process;
            const setup = startedServer.ready.then((serverReady) => {
              if (serverReady) return runFirstTimeSetup(serverUrl, forceSetup);
            });
            armChatCliAutoLaunch(startedServer, setup);
          }

          function configuredFixedDomainServerUrl(): string {
            const raw = process.env.SERVER_URL?.trim();
            if (!raw) throw new Error("Cloudflare fixed-domain hosting requires SERVER_URL. Run the hosting setup again.");
            let parsed: URL;
            try {
              parsed = new URL(raw);
            } catch {
              throw new Error("Cloudflare fixed-domain SERVER_URL is invalid. Run the hosting setup again.");
            }
            const hostname = normalizeFixedDomainHostname(parsed.hostname);
            if (
              parsed.protocol !== "https:" || parsed.username || parsed.password || parsed.port ||
              (parsed.pathname !== "/" && parsed.pathname !== "") || parsed.search || parsed.hash
            ) {
              throw new Error("Cloudflare fixed-domain SERVER_URL must be a bare HTTPS origin such as https://mcp.example.com");
            }
            return `https://${hostname}`;
          }

          '''
          cli = cli.replace(start_marker, named_start + start_marker, 1)

          select_start = cli.index('async function selectHostingMode(forceSetup: boolean): Promise<')
          select_end = cli.index('async function configureNipIoHosting(): Promise<void> {', select_start)
          new_select = '''async function selectHostingMode(forceSetup: boolean): Promise<HostingMode> {
            loadEnvironment();
            const configuredMode = process.env.PI_HOSTING_MODE?.trim();
            if (!forceSetup && (configuredMode === "quick-tunnel" || configuredMode === "nip-io" || configuredMode === "cloudflare-named")) {
              return configuredMode;
            }
            if (configuredMode && configuredMode !== "quick-tunnel" && configuredMode !== "nip-io" && configuredMode !== "cloudflare-named") {
              throw new Error("PI_HOSTING_MODE must be 'quick-tunnel', 'nip-io', or 'cloudflare-named'");
            }

            if (forceSetup) console.error("\\n=== Reconfigure public hosting ===");
            console.error("\\n=== Choose public hosting ===");
            console.error("1. Cloudflare Quick Tunnel (recommended for a first test)");
            console.error("   No account, router changes, or extra setup. Its URL changes every restart, so ChatGPT requires a new connector and OAuth client each session.");
            console.error("2. Direct nip.io HTTPS hosting");
            console.error("   Keeps the same URL while your public IPv4 address stays the same. It exposes this computer to the Internet and requires router port forwarding plus a reachable public IPv4 address.");
            console.error("3. Cloudflare fixed domain (Named Tunnel)");
            console.error("   Uses a hostname you own, such as mcp.example.com. The SSE/OAuth URLs stay the same across PiLink restarts; no inbound router ports are required.");
            const readline = createInterface({ input: process.stdin, output: process.stderr });
            const choice = (await readline.question("Select hosting [1/2/3]: ")).trim();
            readline.close();
            if (choice === "" || choice === "1") {
              saveConfig({ PI_HOSTING_MODE: "quick-tunnel", PI_OAUTH_PUBLIC_CHATGPT_DCR: "true" });
              process.env.PI_HOSTING_MODE = "quick-tunnel";
              process.env.PI_OAUTH_PUBLIC_CHATGPT_DCR = "true";
              return "quick-tunnel";
            }
            if (choice === "2") {
              await configureNipIoHosting();
              return "nip-io";
            }
            if (choice === "3") {
              await configureCloudflareNamedHosting();
              return "cloudflare-named";
            }
            throw new Error("Hosting setup cancelled: choose 1, 2, or 3.");
          }

          async function configureCloudflareNamedHosting(): Promise<void> {
            const port = readPort();
            console.error("\\n=== Cloudflare fixed-domain setup ===");
            console.error("Use a remotely managed Cloudflare Named Tunnel so PiLink needs only that tunnel's token, not an account-wide Cloudflare credential.");
            console.error("In Cloudflare, create/select the tunnel and add a Published application route from your fixed hostname to:");
            console.error(`  http://127.0.0.1:${port}`);
            console.error("Save the tunnel token in a private local file. On Linux/macOS, run: chmod 600 /path/to/tunnel-token");
            console.error("PiLink stores only the token-file path and tunnel UUID; the token value is never written to PiLink configuration or command arguments.");
            const readline = createInterface({ input: process.stdin, output: process.stderr });
            try {
              const hostname = normalizeFixedDomainHostname(await readline.question("Fixed Cloudflare hostname (for example mcp.example.com): "));
              const tunnelId = normalizeFixedDomainTunnelId(await readline.question("Cloudflare tunnel UUID: "));
              const tokenFile = resolveFixedDomainTokenFile(await readline.question("Path to private tunnel token file: "));
              const confirmation = (await readline.question(`Type FIXED after Cloudflare routes https://${hostname} to http://127.0.0.1:${port}: `)).trim();
              if (confirmation !== "FIXED") throw new Error("Cloudflare fixed-domain setup cancelled.");
              const serverUrl = `https://${hostname}`;
              saveConfig({
                PI_HOSTING_MODE: "cloudflare-named",
                PI_CLOUDFLARE_TUNNEL_ID: tunnelId,
                PI_CLOUDFLARE_TOKEN_FILE: tokenFile,
                SERVER_URL: serverUrl,
                TRUST_PROXY: "true",
                PI_OAUTH_PUBLIC_CHATGPT_DCR: "true",
              });
              process.env.PI_HOSTING_MODE = "cloudflare-named";
              process.env.PI_CLOUDFLARE_TUNNEL_ID = tunnelId;
              process.env.PI_CLOUDFLARE_TOKEN_FILE = tokenFile;
              process.env.SERVER_URL = serverUrl;
              process.env.TRUST_PROXY = "true";
              process.env.PI_OAUTH_PUBLIC_CHATGPT_DCR = "true";
              console.error(`PiLink will reuse the fixed MCP URL: ${serverUrl}/sse`);
            } finally {
              readline.close();
            }
          }

          '''
          cli = cli[:select_start] + new_select + cli[select_end:]

          print_marker = 'function printQuickTunnelStartupInstructions(serverUrl: string): void {\n'
          if cli.count(print_marker) != 1:
              raise SystemExit("quick tunnel print marker must be unique")
          named_print = '''function printCloudflareNamedStartupInstructions(serverUrl: string): void {
            console.error("\\n=== Cloudflare fixed domain started ===");
            console.error(`1. Your persistent public address is: ${serverUrl}`);
            console.error(`2. Use this MCP server URL in ChatGPT: ${serverUrl}/sse`);
            console.error("3. Keep the Cloudflare Published application route pointed at this PiLink instance.");
            console.error("4. This URL remains the same across ordinary PiLink restarts, so an existing ChatGPT connector and OAuth client can be reused.");
          }

          '''
          cli = cli.replace(print_marker, named_print + print_marker, 1)
          cli_path.write_text(cli, encoding="utf-8")

          helper_path = Path("src/hosting/fixed-domain.ts")
          helper = helper_path.read_text(encoding="utf-8")
          helper = helper.replace(
              '  const expanded = trimmed === "~" || trimmed.startsWith(`~${path.sep}`)\n    ? path.join(os.homedir(), trimmed.slice(2))\n    : trimmed;\n',
              '  const homeRelative = trimmed.match(/^~[\\\\/](.*)$/u);\n  const expanded = trimmed === "~" ? os.homedir() : homeRelative ? path.join(os.homedir(), homeRelative[1]) : trimmed;\n',
          )
          helper_path.write_text(helper, encoding="utf-8")

          tests_path = Path("test/cli-guided-setup.test.mjs")
          tests = tests_path.read_text(encoding="utf-8").replace('Select hosting [1/2]:', 'Select hosting [1/2/3]:')
          insert_before = 'test("paired CLI setup opens a one-use owner session before ChatGPT OAuth", async (t) => {'
          if tests.count(insert_before) != 1:
              raise SystemExit("paired setup test marker must be unique")
          new_tests = r'''for (const mode of ["single", "collaboration"]) {
            test(`Cloudflare fixed-domain hosting keeps one SSE URL in ${mode} mode`, async (t) => {
              const root = await fs.mkdtemp(path.join(os.tmpdir(), `pilink-fixed-${mode}-`));
              const configPath = path.join(root, ".env");
              const tokenFile = path.join(root, "tunnel-token");
              const argsLog = path.join(root, "cloudflared-args.txt");
              const fakeCloudflared = path.join(root, "cloudflared");
              const port = await availablePort();
              const tunnelId = "11111111-2222-4333-8444-555555555555";
              const hostname = `mcp-${mode}.example.test`;
              await fs.writeFile(configPath, [
                `PI_WORK_DIR=${root}`,
                `PI_DATA_DIR=${path.join(root, "data")}`,
                `PORT=${port}`,
                `JWT_SECRET=${"a".repeat(32)}`,
                `PI_BOOTSTRAP_SECRET=${"b".repeat(32)}`,
              ].join("\n"));
              await fs.writeFile(tokenFile, "test-tunnel-token\n", { mode: 0o600 });
              if (process.platform !== "win32") await fs.chmod(tokenFile, 0o600);
              await fs.writeFile(
                fakeCloudflared,
                '#!/bin/sh\nif [ "$1" = "--version" ]; then exit 0; fi\nprintf "%s\\n" "$*" > "$PI_CLOUDFLARED_ARGS_LOG"\nexec sleep 30\n',
                { mode: 0o700 },
              );
              const cliProcess = spawnCli(["start", "--mode", mode], root, {
                PILINK_CONFIG: configPath,
                PI_CLOUDFLARED_PATH: fakeCloudflared,
                PI_CLOUDFLARED_ARGS_LOG: argsLog,
              });
              t.after(async () => {
                cliProcess.kill("SIGINT");
                await fs.rm(root, { recursive: true, force: true });
              });
              let output = "";
              cliProcess.stdout.on("data", (chunk) => { output += chunk; });
              cliProcess.stderr.on("data", (chunk) => { output += chunk; });

              await waitFor(() => output.includes("Select hosting [1/2/3]:"));
              assert.match(output, /Cloudflare fixed domain \(Named Tunnel\)/);
              cliProcess.stdin.write("3\n");
              await waitFor(() => output.includes("Fixed Cloudflare hostname"));
              cliProcess.stdin.write(`${hostname}\n`);
              await waitFor(() => output.includes("Cloudflare tunnel UUID"));
              cliProcess.stdin.write(`${tunnelId}\n`);
              await waitFor(() => output.includes("Path to private tunnel token file"));
              cliProcess.stdin.write(`${tokenFile}\n`);
              await waitFor(() => output.includes("Type FIXED"));
              cliProcess.stdin.write("FIXED\n");
              await waitFor(() => output.includes("Paste callback URL here:"));
              cliProcess.stdin.write("\n");
              await waitFor(() => output.includes("ChatGPT client registration skipped"));

              assert.match(output, new RegExp(`Use this MCP server URL in ChatGPT: https://${hostname.replaceAll(".", "\\.")}\\/sse`));
              assert.match(output, /existing ChatGPT connector and OAuth client can be reused/);
              const config = await fs.readFile(configPath, "utf8");
              assert.match(config, /^PI_HOSTING_MODE=cloudflare-named$/m);
              assert.match(config, new RegExp(`^PI_RUNTIME_MODE=${mode}$`, "m"));
              assert.match(config, new RegExp(`^SERVER_URL=https://${hostname.replaceAll(".", "\\.")}$`, "m"));
              assert.match(config, new RegExp(`^PI_CLOUDFLARE_TUNNEL_ID=${tunnelId}$`, "m"));
              assert.match(config, new RegExp(`^PI_CLOUDFLARE_TOKEN_FILE=${escapeRegExp(tokenFile)}$`, "m"));
              const args = await fs.readFile(argsLog, "utf8");
              assert.match(args, new RegExp(`run --token-file ${escapeRegExp(tokenFile)} ${tunnelId}`));
              assert.doesNotMatch(args, /test-tunnel-token/);
            });
          }

          '''
          tests = tests.replace(insert_before, new_tests + insert_before, 1)
          tests_path.write_text(tests, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              '- Local-only, existing-domain, Cloudflare, and legacy direct HTTPS hosting.\n',
              '- Quick Tunnel, fixed Cloudflare domain, existing-domain, local-only, and legacy direct HTTPS hosting.\n',
              "README hosting feature",
          )
          readme = replace_once(
              readme,
              'pilink start --mode vscode\n```\n',
              'pilink start --mode vscode\n```\n\nThe CLI hosting wizard offers Quick Tunnel, direct `nip.io`, or a Cloudflare fixed domain (Named Tunnel). The fixed-domain choice keeps the same `/sse` URL across restarts.\n',
              "README start hosting note",
          )
          readme_path.write_text(readme, encoding="utf-8")

          guide_path = Path("docs/operations/getting-started.md")
          guide = guide_path.read_text(encoding="utf-8")
          guide = guide.replace(
              'On Linux, PiLink automatically downloads the official hosting binary (`cloudflared` for Quick Tunnel or `caddy` for `nip.io`) on the first `start`; no separate Cloudflare account or `sudo` is required. On macOS and Windows, install `cloudflared` or `caddy` yourself first.\n',
              'PiLink automatically downloads its pinned `cloudflared` binary on first use on Linux and Windows x64. Direct `nip.io` hosting still uses Caddy and has separate platform requirements. Quick Tunnel needs no Cloudflare account.\n',
          )
          hosting_anchor = '2. **Direct `nip.io` HTTPS hosting** uses a hostname containing your public IPv4 address. It stays the same while that IP address remains unchanged, allowing one ChatGPT connector to be reused. PiLink downloads Caddy automatically on Linux and runs it locally to obtain and renew a trusted HTTPS certificate.\n'
          fixed_doc = hosting_anchor + '\n3. **Cloudflare fixed domain (Named Tunnel)** uses a hostname in a Cloudflare zone you own, such as `mcp.example.com`. Create a remotely managed tunnel in Cloudflare, add a Published application route from that hostname to the PiLink loopback origin printed by the wizard (normally `http://127.0.0.1:3200`), save the tunnel token in a private local file, and note the tunnel UUID. Choose option 3 and enter those values. PiLink runs `cloudflared` with `--token-file`, saves the stable `SERVER_URL`, and reuses the same `/sse` and OAuth URLs on ordinary restarts. No inbound router forwarding is required.\n'
          if hosting_anchor not in guide:
              raise SystemExit("getting-started hosting anchor missing")
          guide = guide.replace(hosting_anchor, fixed_doc, 1)
          guide_path.write_text(guide, encoding="utf-8")

          extension_path = Path("packages/vscode/src/extension.ts")
          extension = extension_path.read_text(encoding="utf-8")
          extension = replace_once(
              extension,
              '        label: "Cloudflare Named Tunnel",\n        description: "Recommended for production · stable HTTPS domain and automatic startup",\n',
              '        label: "Cloudflare fixed domain (Named Tunnel)",\n        description: "Recommended for production · stable SSE/OAuth URL and automatic startup",\n',
              "VS Code named tunnel picker label",
          )
          extension_path.write_text(extension, encoding="utf-8")

          model_path = Path("packages/vscode/src/hosting-model.ts")
          model = model_path.read_text(encoding="utf-8")
          model = replace_once(
              model,
              '    case "cloudflare-named": return "Cloudflare Named Tunnel";\n',
              '    case "cloudflare-named": return "Cloudflare fixed domain (Named Tunnel)";\n',
              "VS Code hosting label",
          )
          model_path.write_text(model, encoding="utf-8")
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts --audit=false
      - run: npm run test:all
      - name: Commit tested implementation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-fixed-domain-hosting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.ts src/hosting/fixed-domain.ts test/cli-guided-setup.test.mjs test/fixed-domain-hosting.test.mjs README.md docs/operations/getting-started.md packages/vscode/src/extension.ts packages/vscode/src/hosting-model.ts .github/workflows/one-shot-fixed-domain-hosting.yml
          git commit -m "feat: add Cloudflare fixed-domain hosting option"
          git push origin HEAD:chatgpt/fixed-domain-hosting
